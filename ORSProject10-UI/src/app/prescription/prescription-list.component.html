<app-navbar></app-navbar>

<style>
  #nnn {
    background: none;
    border: none;
    cursor: pointer;
  }

  .panel-heading {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-inputs {
    margin-top: 20px;
  }

  .search-inputs .form-control,
  .search-inputs .btn {
    margin-bottom: 10px;
  }

  .content-wrapper {
    background: url('assets/files/teahu.png') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: auto;
    height: 105vh;
    padding: 20px;
  }

  .table-responsive {
    margin-top: 20px;
  }

  .search-inputs .col-sm-2,
  .search-inputs .col-sm-1 {
    padding: 0 5px;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="content-wrapper">
  <div class="container-fluid">
    <div class="panel panel-primary" style="padding-top: 73px;">

      <!-- Heading -->
      <div class="panel-heading">
        <h1 class="text-primary font-weight-bold">
          {{ 'Prescription List' | translate }}
        </h1>
      </div>

      <!-- Search Section -->
      <div class="row search-inputs p-1 justify-content-center g-3">

        <!-- Patient Name -->
        <div class="col-sm-2">
          <input type="text" name="patientName" [(ngModel)]="form.searchParams.patientName" class="form-control"
            placeholder="Enter patient name">
        </div>

        <!-- Doctor Name Dropdown -->
        <div class="col-sm-2">
          <select class="form-control" name="doctorName" [(ngModel)]="form.searchParams.doctorName">
            <option [ngValue]="undefined">Select Doctor</option>
            <option value="Dr.Pradeep">Dr. Pradeep</option>
            <option value="Dr. Pooja">Dr. Pooja</option>
            <option value="Dr. Sonu">Dr. Sonu</option>
          </select>
        </div>

        <!-- Mobile Number -->
        <div class="col-sm-2">
          <input type="text" name="mobileNumber" [(ngModel)]="form.searchParams.mobileNumber" class="form-control"
            placeholder="Enter mobile number">
        </div>

        <!-- Search Button -->
        <div class="col-sm-1">
          <button (click)="submit()" class="btn btn-primary w-100">
            Search
          </button>
        </div>

        <!-- Add Button -->
        <div>
          <button (click)="forward('/prescription')" type="button" class="btn btn-success w-100">
            Add Prescription
          </button>
        </div>

        <!-- Delete -->
        <div class="col-sm-1">
          <button (click)="deleteMany()" class="btn btn-danger w-100">
            Delete
          </button>
        </div>

      </div>

     <div *ngIf="form.error" class="alert alert-danger alert-dismissible">
        <button type="button" class="close" data-dismiss="alert">&times;</button>
        {{ form.message }}
      </div>

      <div *ngIf="!form.error && form.message != null" class="alert alert-success alert-dismissible">
        <button type="button" class="close" data-dismiss="alert">&times;</button>
        {{ form.message }}
      </div>

      <!-- Table -->
      <div class="table-responsive">
        <table class="table table-bordered table-hover table-dark">
          <thead class="thead-dark text-uppercase">
            <tr align="center">
             <th><input type="checkbox" [(ngModel)]="isMasterSel" name="list_name"
                  (change)="checkUncheckAll($event)" /></th>
              <th>S.No</th>
              <th>Patient Name</th>
              <th>Doctor Name</th>
              <th>Mobile Number</th>
              <th>Prescribed Date</th>
              <th>Edit</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let m of form.list; let i = index" align="center">

                           <td><input type="checkbox" #checkboxes (change)="checklistUpdate()" name="list_name" [id]="m.id" /></td>

              <td>{{ (form.pageNo * 5) + i + 1 }}</td>
              <td>{{ m.patientName }}</td>
              <td>{{ m.doctorName }}</td>
              <td>{{ m.mobileNumber }}</td>
              <td>{{ m.prescribedDate | date:'dd-MM-yyyy' }}</td>

              <td>
                <button class="fa fa-edit text-primary" id="nnn" (click)="forward('/prescription/' + m.id)">
                </button>
              </td>

            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="d-flex justify-content-between mt-3">

          <button (click)="previous()" [disabled]="form.pageNo == 0" class="btn btn-info">
            Previous
          </button>

          <div>
            <a class="btn btn-warning mr-1" [routerLink]="['/prescriptionlist']" (click)="exit()">
              Reset
            </a>
          </div>

          <div *ngIf="form.list.length == 0">
            <a class="btn btn-warning mr-1" [routerLink]="['/prescriptionlist']">
              Back
            </a>
          </div>

          <button (click)="next()" [disabled]="nextList == 0" class="btn btn-info">
            Next
          </button>

        </div>
      </div>

    </div>
  </div>
</div>

<app-footer></app-footer>
