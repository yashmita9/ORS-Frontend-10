<app-navbar></app-navbar>


<style>
  #nnn {
    background: none;
    border: none;
    cursor: pointer;
  }

  .panel-heading {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-inputs {
    margin-top: 20px;
  }

  .search-inputs .form-control,
  .search-inputs .btn {
    margin-bottom: 10px;
  }

  .content-wrapper {
    background: url('assets/files/teahu.png') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: auto;
    height: 105vh;
    padding: 20px;
  }

  .table-responsive {
    margin-top: 20px;
  }

  .search-inputs .col-sm-2,
  .search-inputs .col-sm-1 {
    padding: 0 5px;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="content-wrapper">
  <div class="container-fluid">
    <div class="panel panel-primary" style="padding-top: 73px;">

      <!-- Heading -->
      <div class="panel-heading">
        <h1 class="text-primary font-weight-bold">
          {{ 'Inventory List' | translate }}
        </h1>
      </div>

      <!-- Search Section -->
      <div class="row search-inputs p-1 justify-content-center g-3">

        <!-- Supplier Name -->
        <div class="col-sm-2">
          <input type="text" name="supplierName" [(ngModel)]="form.searchParams.supplierName" class="form-control"
            placeholder="Enter Supplier Name">
        </div>

       <div class="col-sm-2">
          <select class="form-control" name="product" [(ngModel)]="form.searchParams.product"
            aria-label="ngSelected" required>
            <option [ngValue]="undefined">{{ 'Select Product' | translate }}</option>
            <option value="Laptop">{{ 'Laptop' | translate }}</option>
            <option value="Mobile">{{ 'Mobile' | translate }}</option>
            <option value="Keyboard">{{ 'Keyboard' | translate }}</option>
            <option value="Mouse">{{ 'Mouse' | translate }}</option>
            <option value="Headphones">{{ 'Headphones' | translate }}</option>
          </select>
        </div>

        <!-- Quantity -->
        <div class="col-sm-2">
          <input type="number" name="quantity" [(ngModel)]="form.searchParams.quantity" class="form-control"
            placeholder="Enter Quantity">
        </div>

        <!-- Search Button -->
        <div class="col-sm-1">
          <button (click)="submit()" class="btn btn-primary w-100">
            {{ 'Search' | translate }}
          </button>
        </div>

        <!-- Add Inventory -->
        <div>
          <button (click)="forward('/inventory')" class="btn btn-success w-100">
            Add Inventory
          </button>
        </div>

        <!-- Delete -->
        <div class="col-sm-1">
          <button (click)="deleteMany()" class="btn btn-danger w-100">
            {{ 'Delete' | translate }}
          </button>
        </div>

      </div>

      <!-- Messages -->
      <div *ngIf="!form.error && form.message != null" class="alert alert-success alert-dismissible">
        <button type="button" class="close" data-dismiss="alert">&times;</button>
        {{form.message}}
      </div>
     <div *ngIf="form.error" class="alert alert-danger">
       <button type="button" class="close" data-dismiss="alert">&times;</button>
  {{ form.message }}
</div>

      <!-- Table -->
      <div class="table-responsive">
        <table class="table table-bordered table-hover table-dark">

          <thead class="thead-dark text-uppercase">
            <tr align="center">
              <th>
               <input type="checkbox" [(ngModel)]="isMasterSel" name="list_name"
                  (change)="checkUncheckAll($event)" />
              </th>
              <th>S.No</th>
              <th>Supplier Name</th>
              <th>DOB</th>
              <th>Product</th>
              <th>Quantity</th>
              <th>Edit</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let m of form.list; let i = index" align="center">

              <td>
                <input type="checkbox" #checkboxes (change)="checklistUpdate()" name="list_name" [id]="m.id" />
              </td>

              <td>{{ (form.pageNo * 5) + i + 1 }}</td>
              <td>{{ m.supplierName }}</td>
              <td>{{ m.dob }}</td>
              <td>{{ m.product }}</td>
              <td>{{ m.quantity }}</td>

              <td>
                <button class="fa fa-edit text-primary" id="nnn" (click)="forward('/inventory/' + m.id)">
                </button>
              </td>

            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="d-flex justify-content-between mt-3">

          <button (click)="previous()" [disabled]="form.pageNo == 0" class="btn btn-info">
            Previous
          </button>

          <a class="btn btn-warning" [routerLink]="['/inventorylist']" (click)="exit()">
            Reset
          </a>

          <button (click)="next()" [disabled]="nextList == 0" class="btn btn-info">
            Next
          </button>

        </div>

      </div>

    </div>
  </div>
</div>

<app-footer></app-footer>
